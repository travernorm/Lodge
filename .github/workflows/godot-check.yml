name: Godot check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          ./godot --version

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Smoke test
        run: ./godot --headless --path . --script res://tests/smoke_test.gd

      - name: Cast tests
        run: ./godot --headless --path . --script res://tests/cast_test.gd

      - name: Cast rules tests
        run: ./godot --headless --path . --script res://tests/cast_rules_test.gd

      - name: Fishing tests
        run: ./godot --headless --path . --script res://tests/fishing_test.gd

      - name: River tests
        run: ./godot --headless --path . --script res://tests/river_test.gd
